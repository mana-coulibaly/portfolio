<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jeu de la vie | Mana Coulibaly</title><link rel="stylesheet" href="project.css"></head><body><main class="project-shell"><nav class="project-nav"><strong>Mana Coulibaly</strong><a href="../index.html#work">← Retour aux projets</a></nav><header class="project-hero"><p class="eyebrow">Simulation locale · Automates cellulaires</p><h1>Jeu de la vie</h1><p class="lead">Une simulation visuelle locale permettant d’observer l’évolution d’une population selon les règles de Conway.</p></header><section class="preview"><div class="game-toolbar"><button id="next">Génération suivante</button><button class="secondary" id="random">Nouvelle population</button><span>Génération : <strong id="generation">0</strong></span></div><div class="life-grid" id="grid" aria-label="Grille du Jeu de la vie"></div></section></main><script>const size=16,grid=document.querySelector('#grid'),generation=document.querySelector('#generation');let cells=Array.from({length:size*size},()=>Math.random()>.7);function draw(){grid.innerHTML='';cells.forEach((alive,i)=>{const c=document.createElement('button');c.className='life-cell'+(alive?' alive':'');c.setAttribute('aria-label',alive?'Cellule vivante':'Cellule morte');c.onclick=()=>{cells[i]=!cells[i];draw()};grid.appendChild(c)})}function step(){const next=cells.map((alive,i)=>{const x=i%size,y=Math.floor(i/size),n=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(dx||dy){const nx=x+dx,ny=y+dy;if(nx>=0&&nx<size&&ny>=0&&ny<size)n.push(cells[ny*size+nx])}const count=n.filter(Boolean).length;return alive?(count===2||count===3):count===3});cells=next;generation.textContent=Number(generation.textContent)+1;draw()}document.querySelector('#next').onclick=step;document.querySelector('#random').onclick=()=>{cells=cells.map(()=>Math.random()>.7);generation.textContent=0;draw()};draw();</script></body></html>
