<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Visualisation de données médicales</title>
  <desc id="desc">Tableau de données stylisé avec courbes et indicateurs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07152e"/><stop offset="1" stop-color="#123d65"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#49d8df"/><stop offset="1" stop-color="#a477ff"/></linearGradient>
  </defs>
  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <rect x="70" y="70" width="1060" height="620" rx="24" fill="#0d2342" stroke="#2b5b84" stroke-width="3"/>
  <g fill="#dff8ff"><text x="112" y="142" font-family="Arial,sans-serif" font-size="30" font-weight="700">Analyse des données</text><text x="112" y="180" font-family="Arial,sans-serif" font-size="18" fill="#8ec6dd">Variables · tendances · prédiction</text></g>
  <g fill="#16365b" stroke="#2d638e" stroke-width="2"><rect x="112" y="225" width="300" height="130" rx="16"/><rect x="450" y="225" width="300" height="130" rx="16"/><rect x="788" y="225" width="300" height="130" rx="16"/></g>
  <g font-family="Arial,sans-serif"><text x="140" y="270" font-size="18" fill="#8ec6dd">Observations</text><text x="140" y="324" font-size="42" font-weight="700" fill="#e8fbff">1 000+</text><text x="478" y="270" font-size="18" fill="#8ec6dd">Variables</text><text x="478" y="324" font-size="42" font-weight="700" fill="#e8fbff">11</text><text x="816" y="270" font-size="18" fill="#8ec6dd">Modèle</text><text x="816" y="324" font-size="42" font-weight="700" fill="#8effd4">AUC</text></g>
  <path d="M120 590 C210 520 250 550 330 475 S470 520 545 430 S700 470 790 390 S930 435 1080 300" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <path d="M120 590H1080M120 480H1080M120 370H1080" stroke="#295379" stroke-width="2" opacity=".65"/>
  <g fill="#55e1e4"><circle cx="330" cy="475" r="9"/><circle cx="545" cy="430" r="9"/><circle cx="790" cy="390" r="9"/></g><g fill="#b58bff"><circle cx="1080" cy="300" r="11"/></g>
